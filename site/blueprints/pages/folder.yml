title: Folder
icon: 📁
status:
  draft: false
  listed: true
create:
  status: listed
options:
  template: finder
columns:
  - width: 2/3
    sections:
      subfolders:
        type: pages
        label: Subfolders
        status: all
        template: folder
        create:
          - folder
      textfiles:
        type: pages
        label: Text Files
        status: all
        template: textfile
        create:
          - textfile
      links:
        type: pages
        label: External Links
        status: all
        template: externallink
        create:
          - externallink
      uploads:
        type: files
        label: Media Files
        layout: cards
        info: "{{ file.type }} - {{ file.niceSize }}"
  - width: 1/3
    fields:
      hover_image:
        label: Hover Background Image
        type: files
        multiple: false
        template: hover-background-image  # WICHTIG: Template zuweisen
        help: This image will show as background when hovering over this folder
      hover_image_inset:
        label: Inset Hover Image (80% size)
        type: toggle
        text: Show hover image at 80% size with border instead of full-bleed
        default: false
        help: When enabled, the hover image will be displayed at 80% size with a border frame instead of covering the full interface
